[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillhub-selfhost"
dynamic = ["version"]
description = "A self-hosted AI skill marketplace"
requires-python = ">=3.8"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "tortoise-orm[asyncpg]",
    "aiosqlite",
    "python-multipart",
    "bcrypt",
    "PyJWT",
    "typer",
    "aiofiles",
]
license = {text = "Apache-2.0"}

[tool.setuptools.dynamic]
version = {attr = "skillhub_selfhost.__version__.__version__"}

[project.scripts]
skillhub-selfhost = "skillhub_selfhost.cli:app"

[tool.setuptools.packages.find]
include = ["skillhub_selfhost*"]

[tool.setuptools.package-data]
skillhub_selfhost = ["dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"